[project]
name = "cms-hte-patient-matching-test-set"
version = "0.1.0"
description = "Test set and generation code for validating an algorithm against the CMS HTE Patient Matching Specification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "patient_matching @ git+https://github.com/icanbwell/patient-matching.git@main",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
]

[tool.uv]
package = false
